<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Lumendelve Lantern Crystal Emblem">
  <defs>
    <linearGradient id="crystalLit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="crystalShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Deep ink obsidian medallion badge -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#1A1512" stroke="#f59e0b" stroke-width="3" />

  <!-- Subtle warm aura behind lantern core -->
  <circle cx="32" cy="34" r="17" fill="#f59e0b" fill-opacity="0.16" />

  <!-- Lantern bail ring & crown cap -->
  <circle cx="32" cy="11.5" r="3.5" fill="none" stroke="#f59e0b" stroke-width="2.5" />
  <path d="M22 19 L42 19 L38 15 L26 15 Z" fill="#f59e0b" stroke="#1A1512" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Faceted Lumen Crystal housed in ink-framed lantern cage -->
  <polygon points="32,19 44,33 32,48 20,33" fill="url(#crystalLit)" stroke="#1A1512" stroke-width="2.2" stroke-linejoin="round" />
  <!-- Left cel-shaded darker amber facet -->
  <polygon points="32,19 32,48 20,33" fill="url(#crystalShade)" />
  <!-- Top-right crisp highlight facet -->
  <polygon points="32,19 44,33 32,33" fill="#fbbf24" />
  <!-- North Star inner spark -->
  <path d="M32 25.5 L33.8 31.2 L39.5 33 L33.8 34.8 L32 40.5 L30.2 34.8 L24.5 33 L30.2 31.2 Z" fill="#fef3c7" stroke="#1A1512" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Lantern struts & sturdy base -->
  <path d="M21 20 L18.5 33 L21 47 M43 20 L45.5 33 L43 47" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M21 47 L43 47 L40 52.5 L24 52.5 Z" fill="#f59e0b" stroke="#1A1512" stroke-width="1.5" stroke-linejoin="round" />
</svg>
